<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>台股盤後看盤</title>
<style>
:root {
  --bg: #f6f5f2; --card: #ffffff; --text: #1d1d1f; --sub: #6b6b70; --line: #e4e2dc;
  --up: #d93025; --down: #188038; --accent: #2f5d9e; --chip: #eef2f8; --warn: #fff6e0;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #141416; --card: #1f1f23; --text: #ececee; --sub: #9a9aa2; --line: #33333a;
    --up: #ff6b5e; --down: #4cc777; --accent: #8fb3ec; --chip: #26303f; --warn: #3a3220; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text);
  font: 15px/1.5 -apple-system, "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", sans-serif; }
.wrap { max-width: 1200px; margin: 0 auto; padding: 16px; }
header h1 { font-size: 20px; margin: 0; }
header p { margin: 2px 0 0; color: var(--sub); font-size: 13px; }
h2 { font-size: 16px; margin: 24px 0 8px; }
h2 small { color: var(--sub); font-weight: normal; font-size: 12px; }
.num { font-variant-numeric: tabular-nums; }
.up { color: var(--up); } .down { color: var(--down); }

/* 題材排行 */
.themes { display: grid; gap: 6px; }
.theme { display: grid; grid-template-columns: 7.5em 1fr 4.8em; align-items: center; gap: 8px;
  background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px;
  cursor: pointer; text-align: left; color: inherit; font: inherit; }
.theme.on { outline: 2px solid var(--accent); }
.theme .bar { height: 10px; border-radius: 5px; background: var(--up); }
.theme .bar.neg { background: var(--down); }
.theme .v { text-align: right; font-size: 13px; }
.theme .nm { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* 篩選列 */
.tools { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 8px; }
.tools button { border: 1px solid var(--line); background: var(--card); color: var(--text);
  border-radius: 16px; padding: 4px 12px; font: inherit; font-size: 13px; cursor: pointer; }
.tools button.on { background: var(--accent); color: #fff; border-color: var(--accent); }
.tools .lbl { color: var(--sub); font-size: 13px; }

/* 股票卡片 */
.cards { display: grid; gap: 12px; grid-template-columns: 1fr; }
@media (min-width: 700px) { .cards { grid-template-columns: 1fr 1fr; } }
@media (min-width: 1100px) { .cards { grid-template-columns: 1fr 1fr 1fr; } }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
.top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.top .nm { font-size: 17px; font-weight: 600; }
.top .cd { color: var(--sub); font-size: 13px; margin-left: 4px; }
.top .px { font-size: 17px; font-weight: 600; text-align: right; white-space: nowrap; }
.tag { display: inline-block; background: var(--chip); border-radius: 4px; padding: 0 6px; font-size: 12px; margin-right: 4px; }
.need { background: var(--warn); border-radius: 8px; padding: 8px 10px; margin: 10px 0; font-size: 14px; }
.need b { font-size: 16px; }
.sec { border-top: 1px solid var(--line); padding-top: 8px; margin-top: 8px; }
.sec h3 { font-size: 12px; color: var(--sub); margin: 0 0 4px; font-weight: normal; }
.row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; font-size: 13px; }
.row div span { display: block; color: var(--sub); font-size: 11px; }
.eps { display: flex; align-items: flex-end; gap: 3px; height: 44px; margin-top: 4px; }
.eps div { flex: 1; background: var(--accent); border-radius: 2px 2px 0 0; min-height: 1px; position: relative; }
.eps div.neg { background: var(--down); }
.epsl { display: flex; gap: 3px; font-size: 10px; color: var(--sub); }
.epsl span { flex: 1; text-align: center; }
svg.spark { width: 100%; height: 48px; display: block; margin-top: 4px; }
footer { color: var(--sub); font-size: 12px; margin: 28px 0 8px; line-height: 1.7; }
.empty { color: var(--sub); padding: 20px 0; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>台股盤後看盤</h1>
    <p id="meta">載入中…</p>
  </header>

  <h2>① 法人題材排行 <small id="themeNote"></small></h2>
  <div class="themes" id="themes"></div>

  <h2 id="list">② 候選股 <small id="listNote"></small></h2>
  <div class="tools" id="tools"></div>
  <div class="cards" id="cards"></div>

  <footer>
    <div><b>明天門檻怎麼算：</b>明天收盤 ≥「最近 19 天收盤平均」，收盤就會站在明天的 20 日線上；明天成交量 ≥「最近 4 天均量」，就會大於明天的 5 日均量（跟券商 App 一樣，均線含當天）。</div>
    <div>買超張數：外資含外資自營商。題材金額 = 每天買超張數 × 當天收盤價加總。</div>
    <div>資料來源：臺灣證券交易所、證券櫃檯買賣中心、FinMind（產業別、季 EPS）。每天收盤後更新一次，僅供個人參考。</div>
  </footer>
</div>

<script>
const $ = s => document.querySelector(s);
const fmt = (n, d = 0) => n == null ? "—" : Number(n).toLocaleString("zh-TW", { minimumFractionDigits: d, maximumFractionDigits: d });
const sign = n => n > 0 ? "up" : n < 0 ? "down" : "";
const plus = (n, d = 0) => (n > 0 ? "+" : "") + fmt(n, d);
let data, theme = null, sortKey = "amt10";
const SORTS = { amt10: "買超金額", t10: "投信", f10: "外資", buydays: "買超天數" };

function spark(s) {
  const pts = s.spark, w = 200, h = 48, min = Math.min(...pts, s.ma20), max = Math.max(...pts, s.ma20);
  const y = v => h - 4 - (v - min) / (max - min || 1) * (h - 8);
  const line = pts.map((v, i) => `${(i / (pts.length - 1) * w).toFixed(1)},${y(v).toFixed(1)}`).join(" ");
  const color = s.close >= s.ma20 ? "var(--up)" : "var(--down)";
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" role="img" aria-label="近 20 日收盤走勢">
    <line x1="0" x2="${w}" y1="${y(s.ma20)}" y2="${y(s.ma20)}" stroke="var(--sub)" stroke-dasharray="4 3" stroke-width="1"/>
    <polyline points="${line}" fill="none" stroke="${color}" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>`;
}

function epsBars(eps) {
  if (!eps || !eps.length) return "<div class='empty'>查無 EPS</div>";
  const m = Math.max(...eps.map(e => Math.abs(e[1])), 0.01);
  return `<div class="eps">${eps.map(e => `<div class="${e[1] < 0 ? "neg" : ""}" style="height:${Math.abs(e[1]) / m * 100}%" title="${e[0]} ${e[1]}"></div>`).join("")}</div>
    <div class="epsl">${eps.map(e => `<span>${e[0]}<br>${e[1]}</span>`).join("")}</div>`;
}

function card(s) {
  const above = s.close >= s.ma20, volOk = s.vol >= s.vma5;
  return `<div class="card">
    <div class="top">
      <div><span class="nm">${s.name}</span><span class="cd">${s.code}</span><br>
        <span class="tag">${s.ind}</span><span class="tag">${s.mkt}</span></div>
      <div class="px num">${fmt(s.close, 2)}<br><span class="${sign(s.chg)}" style="font-size:13px">${plus(s.chg, 2)}%</span></div>
    </div>
    <div class="need">明天門檻：收盤 ≥ <b class="num">${fmt(s.px_need, 2)}</b>　量 ≥ <b class="num">${fmt(s.vol_need)}</b> 張</div>
    <div class="sec"><h3>籌碼（近 ${data.chip_days} 日，張）</h3>
      <div class="row num">
        <div><span>外資</span><b class="${sign(s.f10)}">${plus(s.f10)}</b></div>
        <div><span>投信</span><b class="${sign(s.t10)}">${plus(s.t10)}</b></div>
        <div><span>自營商</span><b class="${sign(s.d10)}">${plus(s.d10)}</b></div>
        <div><span>買超金額</span><b class="${sign(s.amt10)}">${plus(s.amt10, 1)} 億</b></div>
      </div>
      <div style="font-size:13px;margin-top:4px">${data.chip_days} 天中買超 ${s.buydays} 天，連買 ${s.streak} 天</div>
    </div>
    <div class="sec"><h3>基本面</h3>
      <div class="row num">
        <div><span>本益比</span><b>${s.pe ? fmt(s.pe, 1) : "—"}</b></div>
        <div><span>近 4 季 EPS</span><b>${fmt(s.eps4, 2)}</b></div>
        <div><span>最新季年增</span><b class="${sign(s.eps_yoy)}">${s.eps_yoy == null ? "—" : plus(s.eps_yoy) + "%"}</b></div>
        <div></div>
      </div>
      ${epsBars(s.eps)}
    </div>
    <div class="sec"><h3>技術面</h3>
      <div class="row num">
        <div><span>20 日線</span><b>${fmt(s.ma20, 2)}</b></div>
        <div><span>位置</span><b class="${above ? "up" : "down"}">${above ? "站上" : "跌破"}</b></div>
        <div><span>20 日線方向</span><b class="${s.ma20_up ? "up" : "down"}">${s.ma20_up ? "上彎" : "下彎"}</b></div>
        <div><span>量 / 5 日均量</span><b class="${volOk ? "up" : "down"}">${fmt(s.vol)} / ${fmt(s.vma5)}</b></div>
      </div>
      ${spark(s)}
    </div>
  </div>`;
}

function render() {
  const max = Math.max(...data.themes.map(t => Math.abs(t.amt)));
  $("#themes").innerHTML = data.themes.map(t => `<button class="theme ${theme === t.name ? "on" : ""}" data-t="${t.name}">
      <span class="nm">${t.name}</span>
      <span><span class="bar ${t.amt < 0 ? "neg" : ""}" style="display:block;width:${Math.abs(t.amt) / max * 100}%"></span></span>
      <span class="v num ${sign(t.amt)}">${plus(t.amt, 1)} 億</span></button>`).join("");
  $("#tools").innerHTML = `<span class="lbl">排序</span>` +
    Object.entries(SORTS).map(([k, v]) => `<button data-s="${k}" class="${sortKey === k ? "on" : ""}">${v}</button>`).join("") +
    (theme ? `<button data-clear="1">✕ ${theme}</button>` : "");
  // 沒選題材：全市場買超前幾名；選了題材：這個題材買超前 5 檔
  const codes = theme ? data.themes.find(t => t.name === theme).top : data.picks;
  const list = codes.map(c => data.stocks[c]).sort((a, b) => b[sortKey] - a[sortKey]);
  $("#listNote").textContent = theme ? `「${theme}」近 ${data.chip_days} 日法人買超前 ${list.length} 檔` : `全市場近 ${data.chip_days} 日三大法人買超金額前 ${list.length} 名，點題材可看該題材前 5 檔`;
  $("#cards").innerHTML = list.length ? list.map(card).join("") : `<div class="empty">這個題材近 ${data.chip_days} 日沒有法人買超的個股</div>`;
}

document.addEventListener("click", e => {
  const t = e.target.closest("[data-t]"), s = e.target.closest("[data-s]"), c = e.target.closest("[data-clear]");
  if (t) theme = theme === t.dataset.t ? null : t.dataset.t;
  else if (s) sortKey = s.dataset.s;
  else if (c) theme = null;
  else return;
  render();
  if (t && theme) $("#list").scrollIntoView({ behavior: "smooth" });
});

fetch("data.json?" + Date.now()).then(r => r.json()).then(d => {
  data = d;
  $("#meta").textContent = `資料日期 ${d.date}｜更新於 ${d.updated}`;
  $("#themeNote").textContent = `近 ${d.chip_days} 日三大法人買超金額，依產業加總`;
  render();
}).catch(() => { $("#meta").textContent = "資料載入失敗"; });
</script>
</body>
</html>
